<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIPI - സ്ഥാപന ഡാഷ്‌ബോർഡ്</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* കമ്പ്യൂട്ടർ സ്ക്രീനിൽ പൂർണ്ണമായി വിശാലമായി കാണാൻ */
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .dashboard-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 900px; /* വിശാലമായ രൂപം */
            box-sizing: border-box;
        }
        .stream-badge {
            background-color: #ebf8ff;
            color: #2b6cb0;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 25px;
            border: 1px.solid #bee3f8;
        }
        .form-row {
            display: flex;
            gap: 30px;
        }
        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div style="text-align: center;">
            <h2 id="collegeTitle" style="color: #1a202c; margin-bottom: 10px; font-size: 28px;">കോളേജ് പേര് ലോഡ് ചെയ്യുന്നു...</h2>
            <div id="streamBadge" class="stream-badge">സ്ട്രീം: ലോഡ് ചെയ്യുന്നു...</div>
        </div>
        
        <form id="perfForm">
            <div class="form-group" style="max-width: 400px; margin: 0 auto 25px auto;">
                <label for="classSelect" style="display: block; margin-bottom: 8px; font-weight: bold; color: #4a5568;">ക്ലാസ് / സെമസ്റ്റർ തിരഞ്ഞെടുക്കുക:</label>
                <select id="classSelect" required>
                    <option value="">ആദ്യം സ്ട്രീം ലോഡ് ചെയ്യപ്പെടുന്നു...</option>
                </select>
            </div>

            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #e2e8f0;">

            <div class="form-row">
                <div class="form-group">
                    <h4 style="color: #2d3748; margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid #edf2f7; padding-bottom: 5px;">മതപരം (Religious)</h4>
                    <label style="display: block; margin-bottom: 5px; color: #4a5568;">നേടിയ ആകെ മാർക്ക്:</label>
                    <input type="number" id="relObtained" required placeholder="ഉദാ: 450">
                    <label style="display: block; margin: 15px 0 5px 0; color: #4a5568;">പരമാവധി ആകെ മാർക്ക്:</label>
                    <input type="number" id="relTotal" required placeholder="ഉദാ: 500">
                </div>
                
                <div class="form-group">
                    <h4 style="color: #2d3748; margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid #edf2f7; padding-bottom: 5px;">ഭൗതികം (Secular)</h4>
                    <label style="display: block; margin-bottom: 5px; color: #4a5568;">നേടിയ ആകെ മാർക്ക്:</label>
                    <input type="number" id="secObtained" required placeholder="ഉദാ: 420">
                    <label style="display: block; margin: 15px 0 5px 0; color: #4a5568;">പരമാവധി ആകെ മാർക്ക്:</label>
                    <input type="number" id="secTotal" required placeholder="ഉദാ: 500">
                </div>
            </div>

            <button type="submit" style="margin-top: 20px;">പെർസെന്റേജ് കണക്കാക്കുക</button>
        </form>

        <div id="resultOutput" style="margin-top: 30px; font-weight: bold; text-align: center; font-size: 18px; color: #2b6cb0; background: #ebf8ff; padding: 15px; border-radius: 6px;"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
