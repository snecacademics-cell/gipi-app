<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIPI - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .dashboard-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 850px;
            box-sizing: border-box;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #1e3c72;
            padding: 15px 25px;
            border-radius: 12px;
            color: white;
        }
        .logout-btn {
            background: #fc5c65;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .logout-btn:hover {
            background: #e04852;
            transform: translateY(-2px);
        }
        .header-box {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.2);
        }
        .stream-badge {
            background-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
            margin-top: 12px;
        }
        .form-row {
            display: flex;
            gap: 25px;
        }
        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border-radius: 30px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #f8fafc;
            outline: none;
        }
        .submit-btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(42, 82, 152, 0.3);
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="top-bar">
            <span style="font-size: 15px; font-weight: 600;"><i class="fa-solid fa-user-shield"></i> Institution Portal</span>
            <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>

        <div class="header-box">
            <h2 id="collegeTitle" style="margin: 0 0 10px 0; font-size: 26px; font-weight: 700;">Loading College Name...</h2>
            <div id="streamBadge" class="stream-badge"><i class="fa-solid fa-graduation-cap"></i> Stream: Loading...</div>
        </div>
        
        <form id="perfForm">
            <div class="form-group">
                <label>Select Semester / Class:</label>
                <select id="classSelect" required>
                    <option value="">Loading stream semesters...</option>
                </select>
            </div>

            <hr style="margin: 25px 0; border: 0; border-top: 1px solid #e2e8f0;">

            <div class="form-row">
                <div class="form-group">
                    <h4 style="color: #1e3c72; margin-bottom: 15px;">Religious Subjects</h4>
                    <label>Marks Obtained:</label>
                    <input type="number" id="relObtained" required placeholder="e.g. 450">
                    <label style="margin-top: 12px;">Total Max Marks:</label>
                    <input type="number" id="relTotal" required placeholder="e.g. 500">
                </div>
                
                <div class="form-group">
                    <h4 style="color: #1e3c72; margin-bottom: 15px;">Secular Subjects</h4>
                    <label>Marks Obtained:</label>
                    <input type="number" id="secObtained" required placeholder="e.g. 420">
                    <label style="margin-top: 12px;">Total Max Marks:</label>
                    <input type="number" id="secTotal" required placeholder="e.g. 500">
                </div>
            </div>

            <button type="submit" class="submit-btn"><i class="fa-solid fa-calculator"></i> Calculate Percentage</button>
        </form>

        <div id="resultOutput" style="margin-top: 25px; font-weight: bold; text-align: center; font-size: 16px; color: #1e3c72; background: #eef2f7; padding: 15px; border-radius: 15px; display: none;"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAoCSN0BznAiThsvUETim_cYDvOes4S2vI",
            authDomain: "gipi-app.firebaseapp.com",
            projectId: "gipi-app",
            storageBucket: "gipi-app.firebasestorage.app",
            messagingSenderId: "922633997761",
            appId: "1:922633997761:web:24abef2b23c2506cce3340",
            measurementId: "G-Z4G2JRGGDL"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const streamSemesters = {
            "SHE": Array.from({length: 10}, (_, i) => `Sem ${i + 1}`),
            "SHE PLUS": Array.from({length: 16}, (_, i) => `Sem ${i + 1}`),
            "SHARIA PLUS": Array.from({length: 20}, (_, i) => `Sem ${i + 1}`),
            "SHARIA": Array.from({length: 16}, (_, i) => `Sem ${i + 1}`),
            "BAITHUL AYN": Array.from({length: 20}, (_, i) => `Sem ${i + 1}`)
        };

        const affNo = localStorage.getItem("gipi_affNo");
        const collegeName = localStorage.getItem("gipi_collegeName");
        const stream = localStorage.getItem("gipi_stream");

        if (!affNo) {
            window.location.replace('index.html');
        } else {
            // അഫിലിയേഷൻ നമ്പറുകൾ ഒഴിവാക്കി കോളേജിന്റെ പേര് മാത്രം ഡിസ്‌പ്ലേ ചെയ്യുന്നു
            document.getElementById('collegeTitle').innerText = collegeName;
            
            let cleanStream = stream ? stream.trim().toUpperCase() : "SHE";
            if (!streamSemesters[cleanStream]) cleanStream = "SHE";

            document.getElementById('streamBadge').innerHTML = `<i class="fa-solid fa-graduation-cap"></i> Stream: ${cleanStream}`;

            const classSelect = document.getElementById('classSelect');
            classSelect.innerHTML = '<option value="">Select Semester</option>';
            streamSemesters[cleanStream].forEach(sem => {
                const opt = document.createElement('option');
                opt.value = sem;
                opt.textContent = sem;
                classSelect.appendChild(opt);
            });
        }

        function logout() {
            localStorage.clear();
            window.location.replace('index.html');
        }

        document.getElementById('perfForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const sem = document.getElementById('classSelect').value;
            const rOb = parseFloat(document.getElementById('relObtained').value);
            const rTot = parseFloat(document.getElementById('relTotal').value);
            const sOb = parseFloat(document.getElementById('secObtained').value);
            const sTot = parseFloat(document.getElementById('secTotal').value);

            const rPer = (rOb / rTot) * 100;
            const sPer = (sOb / sTot) * 100;
            const totalPer = ((rOb + sOb) / (rTot + sTot)) * 100;

            const res = document.getElementById('resultOutput');
            res.style.display = 'block';
            res.innerHTML = `Semester: ${sem} <br>Religious: ${rPer.toFixed(2)}% | Secular: ${sPer.toFixed(2)}% <br>Overall GIPI Score: ${totalPer.toFixed(2)}%`;

            if (affNo) {
                db.collection("colleges").doc(affNo).collection("marks").add({
                    semester: sem, rOb, rTot, sOb, sTot, totalPer,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    alert('Marks saved successfully!');
                });
            }
        });
    </script>
</body>
</html>
