<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIPI - ഡാഷ്‌ബോർഡ്</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container" style="width: 500px;">
        <!-- കോളേജിന്റെ പേര് ഇവിടെ ഓട്ടോമാറ്റിക്കായി വരും -->
        <h2 id="collegeTitle" style="color: #007bff; text-align: center;">കോളേജ് പേര് ലോഡ് ചെയ്യുന്നു...</h2>
        <h3 style="text-align: center; font-size: 16px; color: #555;">സ്ഥാപന പ്രകടന വിലയിരുത്തൽ</h3>
        
        <form id="perfForm">
            <h3>മതപരം (Religious)</h3>
            <label>നേടിയ ആകെ മാർക്ക്:</label>
            <input type="number" id="relObtained" required>
            <label>പരമാവധി ആകെ മാർക്ക്:</label>
            <input type="number" id="relTotal" required>

            <h3>ഭൗതികം (Secular)</h3>
            <label>നേടിയ ആകെ മാർക്ക്:</label>
            <input type="number" id="secObtained" required>
            <label>പരമാവധി ആകെ മാർക്ക്:</label>
            <input type="number" id="secTotal" required>

            <button type="submit">പെർസെന്റേജ് കണക്കാക്കുക</button>
        </form>
        <div id="resultOutput" style="margin-top: 20px; font-weight: bold; text-align: center;"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
