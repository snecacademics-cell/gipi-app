<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIPI - ഡാഷ്‌ബോർഡ്</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .dashboard-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 850px;
            box-sizing: border-box;
        }
        .header-box {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .logout-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .stream-badge {
            background-color: rgba(255,255,255,0.25);
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }
        .form-row {
            display: flex;
            gap: 25px;
        }
        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border-radius: 30px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #f8fafc;
            outline: none;
        }
        .submit-btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(42, 82, 152, 0.3);
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header-box">
            <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> ലോഗ് ഔട്ട്</button>
            <h2 id="collegeTitle" style="margin: 0 0 10px 0; font-size: 24px;">ലോഡ് ചെയ്യുന്നു...</h2>
            <div id="streamBadge" class="stream-badge">സ്ട്രീം: ലോഡ് ചെയ്യുന്നു...</div>
        </div>
        
        <form id="perfForm">
            <div class="form-group">
                <label>സെമസ്റ്റർ / ക്ലാസ് തിരഞ്ഞെടുക്കുക:</label>
                <select id="classSelect" required>
                    <option value="">ആദ്യം സ്ട്രീം ലോഡ് ചെയ്യപ്പെടുന്നു...</option>
                </select>
            </div>

            <hr style="margin: 25px 0; border: 0; border-top: 1px solid #e2e8f0;">

            <div class="form-row">
                <div class="form-group">
                    <h4 style="color: #1e3c72; margin-bottom: 15px;">മതപരം (Religious)</h4>
                    <label>നേടിയ ആകെ മാർക്ക്:</label>
                    <input type="number" id="relObtained" required placeholder="ഉദാ: 450">
                    <label style="margin-top: 12px;">പരമാവധി ആകെ മാർക്ക്:</label>
                    <input type="number" id="relTotal" required placeholder="ഉദാ: 500">
                </div>
                
                <div class="form-group">
                    <h4 style="color: #1e3c72; margin-bottom: 15px;">ഭൗതികം (Secular)</h4>
                    <label>നേടിയ ആകെ മാർക്ക്:</label>
                    <input type="number" id="secObtained" required placeholder="ഉദാ: 420">
                    <label style="margin-top: 12px;">പരമാവധി ആകെ മാർക്ക്:</label>
                    <input type="number" id="secTotal" required placeholder="ഉദാ: 500">
                </div>
            </div>

            <button type="submit" class="submit-btn"><i class="fa-solid fa-calculator"></i> പെർസെന്റേജ് കണക്കാക്കുക</button>
        </form>

        <div id="resultOutput" style="margin-top: 25px; font-weight: bold; text-align: center; font-size: 16px; color: #1e3c72; background: #eef2f7; padding: 15px; border-radius: 15px; display: none;"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAoCSN0BznAiThsvUETim_cYDvOes4S2vI",
            authDomain: "gipi-app.firebaseapp.com",
            projectId: "gipi-app",
            storageBucket: "gipi-app.firebasestorage.app",
            messagingSenderId: "922633997761",
            appId: "1:922633997761:web:24abef2b23c2506cce3340",
            measurementId: "G-Z4G2JRGGDL"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const streamSemesters = {
            "SHE": Array.from({length: 10}, (_, i) => `Sem ${i + 1}`),
            "SHE PLUS": Array.from({length: 16}, (_, i) => `Sem ${i + 1}`),
            "SHARIA PLUS": Array.from({length: 20}, (_, i) => `Sem ${i + 1}`),
            "SHARIA": Array.from({length: 16}, (_, i) => `Sem ${i + 1}`),
            "BAITHUL AYN": Array.from({length: 20}, (_, i) => `Sem ${i + 1}`)
        };

        auth.onAuthStateChanged((user) => {
            if (user) {
                const affiliationNo = user.email.split('@')[0].trim();
                db.collection("colleges").doc(affiliationNo).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('collegeTitle').innerText = `${data.affiliationNo} - ${data.collegeName}`;
                        let stream = data.stream ? data.stream.trim().toUpperCase() : "SHE";
                        if (!streamSemesters[stream]) stream = "SHE";

                        document.getElementById('streamBadge').innerHTML = `<i class="fa-solid fa-graduation-cap"></i> സ്ട്രീം: ${stream}`;

                        const classSelect = document.getElementById('classSelect');
                        classSelect.innerHTML = '<option value="">സെമസ്റ്റർ തിരഞ്ഞെടുക്കുക</option>';
                        streamSemesters[stream].forEach(sem => {
                            const opt = document.createElement('option');
                            opt.value = sem;
                            opt.textContent = sem;
                            classSelect.appendChild(opt);
                        });
                    } else {
                        document.getElementById('collegeTitle').innerText = `കോളേജ് ഡാറ്റ ലഭ്യമല്ല (ID: ${affiliationNo})`;
                    }
                });
            } else {
                window.location.href = 'index.html';
            }
        });

        function logout() {
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            });
        }

        document.getElementById('perfForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const sem = document.getElementById('classSelect').value;
            const rOb = parseFloat(document.getElementById('relObtained').value);
            const rTot = parseFloat(document.getElementById('relTotal').value);
            const sOb = parseFloat(document.getElementById('secObtained').value);
            const sTot = parseFloat(document.getElementById('secTotal').value);

            const rPer = (rOb / rTot) * 100;
            const sPer = (sOb / sTot) * 100;
            const totalPer = ((rOb + sOb) / (rTot + sTot)) * 100;

            const res = document.getElementById('resultOutput');
            res.style.display = 'block';
            res.innerHTML = `സെമസ്റ്റർ: ${sem} <br>മതപരം: ${rPer.toFixed(2)}% | ഭൗതികം: ${sPer.toFixed(2)}% <br>ആകെ സ്കോർ: ${totalPer.toFixed(2)}%`;

            const user = auth.currentUser;
            if (user) {
                const affNo = user.email.split('@')[0];
                db.collection("colleges").doc(affNo).collection("marks").add({
                    semester: sem, rOb, rTot, sOb, sTot, totalPer,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    alert('വിജയകരമായി സേവ് ചെയ്യപ്പെട്ടു!');
                });
            }
        });
    </script>
</body>
</html>
