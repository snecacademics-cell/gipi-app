<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIPI - സ്ഥാപന ഡാഷ്‌ബോർഡ്</title>
    <!-- Font Awesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .dashboard-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 850px;
            box-sizing: border-box;
        }
        .header-box {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.2);
        }
        .stream-badge {
            background-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
            margin-top: 12px;
        }
        .form-row {
            display: flex;
            gap: 25px;
        }
        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border-radius: 30px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #f8fafc;
        }
        input:focus, select:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15);
            background-color: #fff;
        }
        button.submit-btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(42, 82, 152, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }
        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(42, 82, 152, 0.4);
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: #fff;
            padding: 35px;
            border-radius: 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .modal-icon { font-size: 50px; margin-bottom: 20px; }
        .modal-icon.success { color: #05c46b; }
        .modal-icon.error { color: #fc5c65; }
        .modal-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header-box">
            <h2 id="collegeTitle" style="margin: 0 0 10px 0; font-size: 26px; font-weight: 700; letter-spacing: 0.5px;">കോളേജ് പേര് ലോഡ് ചെയ്യുന്നു...</h2>
            <div id="streamBadge" class="stream-badge"><i class="fa-solid fa-graduation-cap"></i> സ്ട്രീം: ലോഡ് ചെയ്യുന്നു...</div>
        </div>
        
        <form id="perfForm">
            <div class="form-group">
                <label for="classSelect"><i class="fa-solid fa-chalkboard-user" style="margin-right: 8px; color: #2a5298;"></i>സെമസ്റ്റർ / ക്ലാസ് തിരഞ്ഞെടുക്കുക:</label>
                <select id="classSelect" required>
                    <option value="">ആദ്യം സ്ട്രീം ലോഡ് ചെയ്യപ്പെടുന്നു...</option>
                </select>
            </div>

            <hr style="margin: 25px 0; border: 0; border-top: 1px solid #e2e8f0;">

            <div class="form-row">
                <div class="form-group">
                    <h4 style="color: #1e3c72; margin-bottom: 15px; font-size: 16px;"><i class="fa-solid fa-book-quran" style="margin-right: 8px;"></i>മതപരം (Religious)</h4>
                    <label>നേടിയ ആകെ മാർക്ക്:</label>
                    <input type="number" id="relObtained" required placeholder="ഉദാ: 450">
                    <label style="margin-top: 12px;">പരമാവധി ആകെ മാർക്ക്:</label>
                    <input type="number" id="relTotal" required placeholder="ഉദാ: 500">
                </div>
                
                <div class="form-group">
                    <h4 style="color: #1e3c72; margin-bottom: 15px; font-size: 16px;"><i class="fa-solid fa-book-open" style="margin-right: 8px;"></i>ഭൗതികം (Secular)</h4>
                    <label>നേടിയ ആകെ മാർക്ക്:</label>
                    <input type="number" id="secObtained" required placeholder="ഉദാ: 420">
                    <label style="margin-top: 12px;">പരമാവധി ആകെ മാർക്ക്:</label>
                    <input type="number" id="secTotal" required placeholder="ഉദാ: 500">
                </div>
            </div>

            <button type="submit" class="submit-btn"><i class="fa-solid fa-calculator"></i> പെർസെന്റേജ് കണക്കാക്കുക</button>
        </form>

        <div id="resultOutput" style="margin-top: 25px; font-weight: bold; text-align: center; font-size: 16px; color: #1e3c72; background: #eef2f7; padding: 15px; border-radius: 15px; display: none;"></div>
    </div>

    <!-- Custom Modal Structure -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-card">
            <div id="modalIconContainer" class="modal-icon success"><i id="modalIcon" class="fa-solid fa-circle-check"></i></div>
            <h3 id="modalTitle" style="margin: 0 0 10px 0; color: #1e293b;">വിജയകരമാണ്</h3>
            <p id="modalMessage" style="color: #64748b; margin: 0; line-height: 1.5; font-size: 15px;"></p>
            <button class="modal-btn" onclick="closeModal()">ശരി</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
