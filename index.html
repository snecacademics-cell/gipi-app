<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIPI - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        h2 {
            color: #1e3c72;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }
        input {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border-radius: 30px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            background-color: #f8fafc;
        }
        input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15);
            background-color: #fff;
        }
        .login-btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(42, 82, 152, 0.3);
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .login-btn:hover {
            transform: translateY(-2px);
        }
        .error-msg {
            color: #fc5c65;
            font-size: 14px;
            margin-top: 15px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Global Institutional Performance Index (GIPI)</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Affiliation Number:</label>
                <input type="text" id="affNo" required placeholder="e.g. 2">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" required placeholder="******">
            </div>
            <button type="submit" class="login-btn">Login</button>
            <div id="errorMsg" class="error-msg">Invalid Affiliation Number or Password!</div>
        </form>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAoCSN0BznAiThsvUETim_cYDvOes4S2vI",
            authDomain: "gipi-app.firebaseapp.com",
            projectId: "gipi-app",
            storageBucket: "gipi-app.firebasestorage.app",
            messagingSenderId: "922633997761",
            appId: "1:922633997761:web:24abef2b23c2506cce3340",
            measurementId: "G-Z4G2JRGGDL"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // പേജ് ഓട്ടോമാറ്റിക്കായി റീലോഡ് ആകുന്നത് തടയുന്നു
            
            const affNo = document.getElementById('affNo').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            try {
                const docRef = await db.collection("colleges").doc(affNo).get();
                
                if (docRef.exists) {
                    const collegeData = docRef.data();
                    
                    // പാസ്‌വേഡ് കൃത്യമായി ഒത്തുനോക്കുന്നു
                    if (String(collegeData.password).trim() === String(password).trim()) {
                        // ലോക്കൽ സ്റ്റോറേജിൽ സെഷൻ സേവ് ചെയ്യുന്നു
                        localStorage.setItem("gipi_affNo", affNo);
                        localStorage.setItem("gipi_collegeName", collegeData.collegeName);
                        localStorage.setItem("gipi_stream", collegeData.stream);

                        // ഡാഷ്‌ബോർഡിലേക്ക് മാറ്റി വിടുന്നു
                        window.location.replace('dashboard.html');
                    } else {
                        errorMsg.style.display = 'block';
                    }
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error("Login Error:", error);
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
